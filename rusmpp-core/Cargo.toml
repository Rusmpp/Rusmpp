[package]
name = "rusmpp-core"
version = "0.4.0"
edition = "2024"
rust-version = "1.86.0"
description = "A Rust SMPP library."
authors = ["Jad K. Haddad <jadkhaddad@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rusmpp/Rusmpp"
readme = "Readme.md"
keywords = ["smpp", "smsc", "messaging", "networking", "protocol"]

[dependencies]
rusmpp-macros = { path = "../rusmpp-macros", version = "0.2.0" }
bytes = { version = "1", default-features = false, optional = true }
heapless = { version = "0.9.2", default-features = false }
arbitrary = { version = "1.4.2", default-features = false, features = [
    "derive_arbitrary",
], optional = true }
serde = { version = "1", default-features = false, features = [
    "derive",
], optional = true }
pastey = "0.2.1"
thiserror = { version = "2", default-features = false }

[dev-dependencies]
strum = "0.28.0"
strum_macros = "0.28.0"


[features]
default = []
# Enables the `alloc` crate.
alloc = ["serde/alloc", "dep:bytes"]
# Implements arbitrary's Arbitrary trait for fuzz testing.
arbitrary = ["dep:arbitrary"]
# Derives serde Serialize for all SMPP types.
serde = ["dep:serde", "heapless/serde", "bytes/serde"]
# Derives serde Deserialize for owned SMPP types. This will allow to create unchecked SMPP values from arbitrary serialized data, which may not be valid SMPP values.
serde-deserialize-unchecked = ["dep:serde", "heapless/serde", "bytes/serde"]
# Exposes test utilities for the `rusmpp-core`.
test = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
