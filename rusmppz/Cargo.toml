[package]
name = "rusmppz"
version = "0.4.0"
edition = "2024"
rust-version = "1.86.0"
description = "A zerocopy Rust SMPP library."
authors = ["Jad K. Haddad <jadkhaddad@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rusmpp/Rusmpp"
readme = "Readme.md"
keywords = ["smpp", "smsc", "messaging", "networking", "protocol"]

[dependencies]
rusmpp-core = { path = "../rusmpp-core", version = "0.4.0", default-features = false }
rusmpp-framez = { path = "../rusmpp-framez", version = "0.1.0", default-features = false, optional = true }

[dev-dependencies]
embedded-io-adapters = { version = "0.7.0", default-features = false, features = [
    "tokio-1",
] }
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
framez = { version = "0.4.0", default-features = false, features = ["tracing"] }

[features]
default = ["framez"]
# Implements framez' Encoder/Decoder traits.
framez = ["dep:rusmpp-framez"]
# Enables logging via the `tracing` crate.
tracing = ["rusmpp-framez/tracing"]

[[example]]
name = "rusmppz_client_server"
path = "examples/rusmppz_client_server.rs"
required-features = ["tracing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
